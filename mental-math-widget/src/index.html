<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mental Math - Training</title>
    <!-- Importazione librerie Chart.js e plugin Zoom -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
        body { 
            font-family: monospace; 
            background-color: rgba(10, 10, 10, 0.92); 
            backdrop-filter: blur(8px); 
            color: #d4d4d4; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        <!-- BARRA DI TRASCINAMENTO -->
        <div data-tauri-drag-region style="position: absolute; top: 0; left: 0; width: calc(100% - 50px); height: 40px; z-index: 9999; cursor: grab; background: rgba(0,0,0,0.01);"></div>
    
        <!-- TASTO CHIUSURA NATIVO -->
        <button id="btn-close-app" style="position: absolute; top: 10px; right: 15px; background: transparent; border: none; color: #888; cursor: pointer; font-size: 1.2rem; z-index: 10000; transition: color 0.2s;">✕</button>
        .hidden { display: none !important; }
        
        .view-container { display: flex; flex-direction: column; gap: 15px; background: #111; padding: 30px; border: 1px solid #333; width: 450px; max-width: 90vw; max-height: 95vh; overflow-y: auto; }
        
        /* Struttura Dashboard Full-Screen */
        .view-dashboard-container { 
            width: 95vw; 
            max-width: 1400px; 
            height: 95vh; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            padding: 25px;
            overflow: hidden; /* Blocca lo scroll dell'intera pagina */
        }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .dashboard-header h2 { margin: 0; }
        
        .dashboard-body { display: flex; flex-direction: column; gap: 15px; flex: 1; overflow: hidden; }
        .dash-row-top { display: flex; gap: 15px; height: 35%; min-height: 150px; }
        .dash-row-bottom { display: flex; gap: 15px; height: 65%; }
        
        .dash-panel { 
            background: #161b22; 
            padding: 15px; 
            border-radius: 6px; 
            border: 1px solid #30363d; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            overflow: hidden; 
        }
        .dash-title { font-size: 0.9rem; color: #8b949e; font-weight: bold; }
        
        .btn { padding: 12px; background: #222; color: #fff; border: 1px solid #555; font-weight: bold; cursor: pointer; font-family: monospace; text-align: center; transition: 0.2s; }
        .btn:hover { background: #ddd; color: #000; }
        .btn-back { background: transparent; border: none; text-align: left; padding: 0; color: #888; font-size: 1rem; cursor: pointer;}
        .btn-back:hover { color: #fff; text-decoration: underline; }
        
        .config-row { display: flex; justify-content: space-between; align-items: center; font-size: 1rem; margin-bottom: 5px; }
        .config-row input, .config-row select { background: #222; color: #fff; border: 1px solid #555; padding: 5px; font-family: monospace; }
        .config-row input { width: 120px; text-align: center; }
        
        .math-grid { display: grid; grid-template-columns: 1fr auto; row-gap: 10px; font-size: 3rem; }
        #multiplicand { text-align: right; }
        #multiplier { text-align: left; white-space: pre; color: #777; }
        #answer-input { grid-column: 1 / 2; font-family: monospace; font-size: 3rem; width: 300px; text-align: right; background: transparent; color: #fff; border: none; border-top: 2px solid #555; padding-top: 10px; outline: none; }
        .error-flash { color: #ff4444 !important; border-top: 2px solid #ff4444 !important; }
        
        .debug-panel { display: flex; gap: 10px; margin-top: 5px; }
        .btn-debug { flex: 1; padding: 8px; font-size: 0.8rem; border: 1px solid #444; color: #bbb; cursor: pointer; font-family: monospace; }
        #btn-dashboard { background: #1a2a3a; }
        #btn-dashboard:hover { background: #2a4a6a; color: #fff; }
        
        /* Stili Presets */
        .presets-wrapper { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #333; align-items: center; }
        .preset-chip { padding: 6px 10px; background: #222; border: 1px solid #444; border-radius: 4px; font-size: 0.85rem; cursor: pointer; color: #aaa; display: flex; align-items: center; justify-content: center; }
        .preset-chip:hover { background: #333; color: #fff; }
        
        /* Elementi interni Dashboard */
        .heatmap-grid { display: flex; gap: 3px; overflow-x: auto; flex: 1; align-items: flex-start; margin-top: 10px; }
        .heatmap-col { display: flex; flex-direction: column; gap: 3px; }
        .heatmap-cell { width: 12px; height: 12px; background: #21262d; border-radius: 2px; }
        .heatmap-cell:hover { outline: 1px solid #fff; }
        .heatmap-cell[data-level="1"] { background: #0e4429; }
        .heatmap-cell[data-level="2"] { background: #006d32; }
        .heatmap-cell[data-level="3"] { background: #26a641; }
        .heatmap-cell[data-level="4"] { background: #39d353; }
        
        #stats-text { font-size: 0.85rem; color: #8b949e; white-space: pre-line; overflow-y: auto; flex: 1; margin-top: 10px; }
        .chart-container-inner { flex: 1; position: relative; min-height: 0; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- SCHERMATA DI SETUP -->
    <div id="view-practice-setup" class="view-container">
        <h2 style="margin-top:0; text-align: center;">Setup Sessione</h2>
        
        <div id="presets-container" class="presets-wrapper">
            <!-- Generato da JS -->
        </div>
        
        <div class="config-row">
            <label>Moltiplicando:</label>
            <input type="text" id="config-digits" value="2" placeholder="es. 2, 2-4">
        </div>
        
        <div class="config-row">
            <label>Moltiplicatore:</label>
            <div style="display: flex; gap: 5px;">
                <select id="config-mult-type">
                    <option value="literal">Esatto</option>
                    <option value="digits">Cifre</option>
                </select>
                <input type="text" id="config-mult" value="11" style="width: 130px;" placeholder="es. 8, 11-13">
            </div>
        </div>
        
        <div class="config-row" style="margin-top: 10px;">
            <label>Tempo:</label>
            <div style="display: flex; gap: 5px;">
                <select id="config-time-type">
                    <option value="s">Secondi</option>
                    <option value="m">Minuti</option>
                </select>
                <input type="number" id="config-time" value="60" style="width: 80px;">
            </div>
        </div>
        
        <button class="btn" id="btn-start-session" style="margin-top: 15px;">Inizia Allenamento</button>

        <div class="debug-panel">
            <button class="btn-debug" id="btn-dashboard">Apri Dashboard</button>
        </div>
    </div>

    <!-- SCHERMATA DASHBOARD -->
    <div id="view-dashboard" class="view-container view-dashboard-container hidden">
        <div class="dashboard-header">
            <button class="btn-back" id="btn-back-setup">&lt; Torna al Setup</button>
            <h2>Analysis Dashboard</h2>
            <div style="width: 100px;"></div> <!-- Spaziatore per centrare il titolo -->
        </div>
        
        <div class="dashboard-body">
            
            <!-- Riga Superiore: Heatmap & Statistiche Testuali -->
            <div class="dash-row-top">
                <div class="dash-panel" style="flex: 2;">
                    <div class="dash-title">Consistency Tracker (dal 05-07-2026)</div>
                    <div id="heatmap-grid" class="heatmap-grid"></div>
                </div>
                <div class="dash-panel" style="flex: 1;">
                    <div class="dash-title">Latenza Attuale (EMA)</div>
                    <div id="stats-text"></div>
                </div>
            </div>

            <!-- Riga Inferiore: Grafici affiancati -->
            <div class="dash-row-bottom">
                <div class="dash-panel">
                    <div class="dash-title">Volume Calcoli Giornaliero</div>
                    <div class="chart-container-inner"><canvas id="chart-volume"></canvas></div>
                </div>
                <div class="dash-panel">
                    <div class="dash-title">Latenza Media (Secondi / Normalizzata)</div>
                    <div class="chart-container-inner"><canvas id="chart-latency"></canvas></div>
                </div>
            </div>

        </div>
    </div>

    <!-- SCHERMATA GIOCO -->
    <div id="view-game" class="hidden" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center; height: 100%;">
        <button class="btn btn-back" id="btn-exit-game" style="position: absolute; top: 20px; left: 20px;">&lt; Abbandona Sessione</button>
        <div class="math-grid">
            <div id="multiplicand">--</div>
            <div id="multiplier"> * --</div>
            <input type="text" id="answer-input" autocomplete="off">
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
