<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH-HUB // TERMINAL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="top-nav">
        <nav class="nav-tabs">
            <button class="nav-btn active" data-target="sec-problems">PROBLEM-SOLVING</button>
            <button class="nav-btn" data-target="sec-mental">MENTAL MATH</button>
            <button class="nav-btn" data-target="sec-dashboard">DASHBOARD</button>
            <button class="nav-btn" data-target="sec-sync">SYNC</button>
        </nav>
        <div class="nav-streaks">
            <span id="nav-streak-prob">PROB: 0</span>
            <span id="nav-streak-calc">CALC: 0</span>
        </div>
    </header>

    <main class="workspace">
        <!-- VISTA 1: PROBLEM SOLVING -->
        <section id="sec-problems">
            
            <!-- SCHERMATA 1: SELEZIONE CORSO (Stile Duolingo) -->
            <div id="course-selection" class="action-area">
                <p style="color:var(--fg-muted); margin-bottom: 20px;">// SELEZIONA UN CORSO PER INIZIARE</p>
                <div id="course-list" style="display:flex; flex-direction:column; gap:15px; width: 100%; max-width: 450px;">
                    <!-- I bottoni dei corsi verranno generati qui da JavaScript -->
                </div>
            </div>

            <!-- SCHERMATA 2: AREA DI LAVORO (Nascosta di default) -->
            <div id="problem-solving-area" class="hidden">
                <div class="problem-meta">
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <span id="prob-breadcrumb">CARICAMENTO IN CORSO...</span>
                        <span id="prob-progress" style="font-size: 0.75rem; color: var(--fg-muted); font-family: var(--font-mono);"></span>
                    </div>
                    <button id="btn-back-courses" class="nav-btn" style="border:none;">[ ESCI ]</button>
                </div>

                <div id="prob-statement" class="problem-statement"></div>

                <div class="action-area">
                    <div id="stage-solve">
                        <button id="btn-done" class="btn">[ DONE ]</button>
                    </div>
                    
                    <div id="stage-rate" class="slider-container hidden">
                        <div class="slider-labels">
                            <span>EASY</span>
                            <span>HARD</span>
                        </div>
                        <input type="range" id="diff-slider" class="raw-slider" min="0" max="1" step="0.01" value="0.5">
                        <button id="btn-next" class="btn" style="margin-top: 15px;">[ NEXT ]</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- VISTA 2: MENTAL MATH (Semplificata nei bordi, mantenuta logica) -->
        <section id="sec-mental" class="hidden">
            <div id="mental-setup-box" class="view-container">
                <p style="color:var(--fg-muted); margin-bottom:20px;">// SETUP TRACHTENBERG</p>
                <div id="presets-container" style="display:flex; gap:10px; margin-bottom:20px;"></div>
                <div style="display:flex; gap:20px; align-items:center;">
                    <input type="text" id="config-digits" value="2" placeholder="Cifre (es. 2)" style="width:100px;">
                    <input type="text" id="config-mult" value="11" placeholder="Molt. (es. 11)" style="width:100px;">
                    <select id="config-mult-type"><option value="literal">Esatto</option><option value="digits">Cifre</option></select>
                    <input type="number" id="config-time" value="60" style="width:60px;"><span>sec</span>
                </div>
                <button class="btn" id="btn-start-session" style="margin-top:30px;">[ START ]</button>
            </div>

            <div id="mental-game-box" class="hidden view-container" style="text-align:center;">
                <div style="display:flex; justify-content:space-between; color:var(--fg-muted);">
                    <span id="mental-timer-display">TEMPO: 60s</span>
                    <span id="mental-score-display">PUNTI: 0</span>
                </div>
                <div id="trachtenberg-rule-banner" style="margin:20px 0; color:var(--fg-muted);"></div>
                <div style="font-size:4rem; margin-top:20px;">
                    <div id="multiplicand">--</div>
                    <div id="multiplier" style="color:var(--fg-muted);">* --</div>
                    <input type="text" id="answer-input" autocomplete="off" inputmode="numeric" style="font-size:4rem; width:100%; text-align:right; border-bottom:2px solid var(--fg);">
                </div>
                <button class="btn" id="btn-exit-game" style="margin-top:40px;">[ END ]</button>
            </div>
        </section>

        <!-- VISTA 3: DASHBOARD (Mantenuta struttura dati, rimossi bordi chiusi) -->
        <section id="sec-dashboard" class="hidden">
            <div class="dash-panel" style="display:flex; justify-content:space-between; font-size:2rem;">
                <div>STREAK: <span id="kpi-prob-streak">0</span></div>
                <div>MASTERY: <span id="kpi-global-mastery">0%</span></div>
            </div>
            <div class="dash-panel">
                <canvas id="chart-prob-timeline" style="height:250px; width:100%;"></canvas>
            </div>
            <div class="dash-panel">
                <canvas id="chart-mental-latency" style="height:250px; width:100%;"></canvas>
            </div>
        </section>

        <!-- VISTA 4: SYNC -->
        <section id="sec-sync" class="hidden">
            <div class="dash-panel">
                <p style="color:var(--fg-muted); margin-bottom:20px;">// GITHUB GIST SYNC</p>
                <input type="password" id="gist-token" placeholder="GitHub Token" style="width:100%; margin-bottom:10px;">
                <input type="text" id="gist-id" placeholder="Gist ID" style="width:100%; margin-bottom:20px;">
                <div style="display:flex; gap:20px;">
                    <button id="btn-gist-push" class="btn">[ PUSH ]</button>
                    <button id="btn-gist-pull" class="btn">[ PULL ]</button>
                </div>
                <div id="sync-log" style="margin-top:20px; min-height:50px;"></div>
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
