<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mental Math - Training</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
        :root { --bg: #0a0a0a; --panel-bg: #111111; --border: #333333; --text: #d4d4d4; --accent: #ffffff; }
        body { font-family: monospace; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .hidden { display: none !important; }
        
        .view-container { display: flex; flex-direction: column; gap: 15px; background: #111; padding: 30px; border: 1px solid #333; width: 450px; max-width: 90vw; max-height: 95vh; overflow-y: auto; }
        .view-dashboard-container { width: 95vw; max-width: 1400px; height: 95vh; padding: 25px; overflow: hidden; }
        
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .dashboard-header h2 { margin: 0; }
        .dashboard-body { display: flex; flex-direction: column; gap: 15px; flex: 1; overflow: hidden; }
        .dash-row-top { display: flex; gap: 15px; height: 35%; min-height: 150px; }
        .dash-row-bottom { display: flex; gap: 15px; height: 65%; }
        
        .dash-panel { background: var(--panel-bg); padding: 15px; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .dash-title { font-size: 0.9rem; color: #8b949e; font-weight: bold; display: flex; align-items: center; }
        
        .btn { padding: 12px; background: #222; color: #fff; border: 1px solid #555; font-weight: bold; cursor: pointer; font-family: monospace; transition: 0.2s; border-radius: 4px; }
        .btn:hover { background: #ddd; color: #000; border-color: #ddd; }
        .btn-back { background: transparent; border: none; padding: 0; color: #888; font-size: 1rem; cursor: pointer; text-align: left; }
        .btn-back:hover { color: #fff; text-decoration: underline; }
        
        .config-row { display: flex; justify-content: space-between; align-items: center; font-size: 1rem; margin-bottom: 5px; }
        .config-row input, .config-row select { background: #222; color: #fff; border: 1px solid #555; padding: 5px; font-family: monospace; }
        .config-row input { width: 120px; text-align: center; }
        
        .math-grid { display: grid; grid-template-columns: 1fr auto; row-gap: 10px; font-size: 3rem; margin-bottom: 20px;}
        #multiplicand { text-align: right; }
        #multiplier { text-align: left; white-space: pre; color: #777; }
        #answer-input { grid-column: 1 / 2; font-family: monospace; font-size: 3rem; width: 300px; text-align: right; background: transparent; color: #fff; border: none; border-top: 2px solid #555; padding-top: 10px; outline: none; }
        .error-flash { color: #ff4444 !important; border-top: 2px solid #ff4444 !important; }
        
        /* Modale e Info Icon per Dashboard */
        .info-icon { display: inline-flex; justify-content: center; align-items: center; width: 16px; height: 16px; border-radius: 50%; background: #444; color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; margin-left: 8px; transition: 0.2s; border: 1px solid #666; }
        .info-icon:hover { background: #666; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 6px; padding: 25px; width: 320px; max-width: 90vw; text-align: center; color: #c9d1d9; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal-box p { font-size: 1rem; line-height: 1.5; margin-bottom: 20px; }

        /* Controlli di gioco (Minimalisti Bianco/Nero) */
        .game-controls { display: flex; gap: 10px; width: 100%; justify-content: center; margin-bottom: 15px; }
        .btn-hint, .btn-sol { flex: 1; }
        #hint-display { color: #d4d4d4; font-size: 1rem; text-align: center; min-height: 40px; }
        
        .debug-panel { display: flex; gap: 10px; margin-top: 5px; }
        .btn-debug { flex: 1; padding: 8px; font-size: 0.8rem; border: 1px solid #444; color: #bbb; cursor: pointer; background: #1a2a3a; font-family: monospace; }
        .btn-debug:hover { background: #2a4a6a; color: #fff; }
        
        .presets-wrapper { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #333; align-items: center; }
        .preset-chip { padding: 6px 10px; background: #222; border: 1px solid #444; border-radius: 4px; font-size: 0.85rem; cursor: pointer; color: #aaa; }
        .preset-chip:hover { background: #333; color: #fff; }
        .preset-input { width: 90px; padding: 5px 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; font-family: monospace; }
        
        .heatmap-grid { display: flex; gap: 3px; overflow-x: auto; flex: 1; align-items: flex-start; margin-top: 10px; }
        .heatmap-col { display: flex; flex-direction: column; gap: 3px; }
        .heatmap-cell { width: 12px; height: 12px; background: #222222; border-radius: 2px; }
        .heatmap-cell:hover { outline: 1px solid #fff; }
        .heatmap-cell[data-level="1"] { background: #444444; }
        .heatmap-cell[data-level="2"] { background: #777777; }
        .heatmap-cell[data-level="3"] { background: #aaaaaa; }
        .heatmap-cell[data-level="4"] { background: #ffffff; }
        
        #stats-text { font-size: 0.85rem; color: #8b949e; white-space: pre-line; overflow-y: auto; flex: 1; margin-top: 10px; }
        .stat-highlight { font-size: 1.5rem; color: #fff; margin-bottom: 5px; }
        .chart-container-inner { flex: 1; position: relative; min-height: 0; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="view-practice-setup" class="view-container">
        <h2 style="margin-top:0; text-align: center;">Session Setup</h2>
        
        <div id="presets-container" class="presets-wrapper"></div>
        
        <div class="config-row">
            <label>Multiplicand:</label>
            <input type="text" id="config-digits" value="2" placeholder="es. 2, 2-4">
        </div>
        
        <div class="config-row">
            <label>Multiplier:</label>
            <div style="display: flex; gap: 5px;">
                <select id="config-mult-type"><option value="literal">Exact</option><option value="digits">Digits</option></select>
                <input type="text" id="config-mult" value="11" style="width: 130px;" placeholder="es. 8, 11-13">
            </div>
        </div>
        
        <div class="config-row" style="margin-top: 10px;">
            <label>Time:</label>
            <div style="display: flex; gap: 5px;">
                <select id="config-time-type"><option value="s">Seconds</option><option value="m">Minutes</option></select>
                <input type="number" id="config-time" value="60" style="width: 80px;">
            </div>
        </div>
        
        <button class="btn" id="btn-start-session" style="margin-top: 15px;">Start Session</button>

        <div class="debug-panel">
            <button class="btn-debug" id="btn-dashboard">Open Dashboard</button>
        </div>
    </div>

    <div id="view-dashboard" class="view-container view-dashboard-container hidden">
        <div class="dashboard-header">
            <button class="btn-back" id="btn-back-setup">&lt; Back to Setup</button>
            <h2>Dashboard</h2>
            <div style="width: 100px;"></div> 
        </div>
        
        <div class="dashboard-body">
            <div class="dash-row-top">
                <div class="dash-panel" style="flex: 2;">
                    <div class="dash-title">
                        Consistency Tracker
                        <span class="info-icon" data-info="Mappa di calore delle tue sessioni giornaliere. I quadratini più chiari indicano un maggior numero di calcoli eseguiti in quel giorno.">i</span>
                    </div>
                    <div id="heatmap-grid" class="heatmap-grid"></div>
                </div>
                
                <div class="dash-panel" style="flex: 1;">
                    <div class="dash-title">
                        Current Latency (EMA)
                        <span class="info-icon" data-info="L'EMA (Media Mobile Esponenziale) dà più peso alle tue performance recenti. Gli errori vengono convertiti in penalità di tempo. Meno secondi = migliore fluidità mentale.">i</span>
                    </div>
                    <div class="chart-container-inner" style="flex:1; position:relative; min-height: 120px; margin-top: 10px;">
                    <canvas id="chart-ema"></canvas>
                    </div>
                </div>

                <div class="dash-panel" style="flex: 1; align-items: center; justify-content: center; text-align: center;">
                    <div class="dash-title" style="margin-bottom: 10px; display:flex; justify-content:center;">
                        Consistency & Streaks
                        <span class="info-icon" data-info="Giorni consecutivi di allenamento. Si azzera se salti un'intera giornata.">i</span>
                    </div>
                    <div>
                        <div id="current-streak" class="stat-highlight">0</div>
                        <div style="color: #8b949e; font-size: 0.85rem;">Current Streak</div>
                        
                        <div id="best-streak" class="stat-highlight" style="margin-top: 15px; color: #d4d4d4;">0</div>
                        <div style="color: #8b949e; font-size: 0.85rem;">Best Streak</div>
                    </div>
                </div>
            </div>

            <div class="dash-row-bottom">
                <div class="dash-panel">
                    <div class="dash-title">
                        Daily Calculation Volume
                        <span class="info-icon" data-info="Clicca e trascina per spostarti. Usa la rotellina per zoomare. La linea mostra la media mobile a 7 giorni.">i</span>
                    </div>
                    <div class="chart-container-inner"><canvas id="chart-volume"></canvas></div>
                </div>
                <div class="dash-panel">
                    <div class="dash-title">
                        Daily Average Latency
                        <span class="info-icon" data-info="Clicca e trascina per spostarti. Mostra il tempo medio impiegato al netto degli errori nel corso del tempo, suddiviso per i vari gruppi di moltiplicatori.">i</span>
                    </div>
                    <div class="chart-container-inner"><canvas id="chart-latency"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <div id="view-game" class="hidden" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; max-width: 450px; margin: 0 auto; position: relative;">
        <button class="btn btn-back" id="btn-exit-game" style="position: absolute; top: 20px; left: 20px;">&lt; Quit</button>
        
        <div class="math-grid">
            <div id="multiplicand">--</div>
            <div id="multiplier"> * --</div>
            <input type="text" id="answer-input" autocomplete="off">
        </div>

        <div class="game-controls">
            <button class="btn btn-hint" id="btn-hint">Rule</button>
            <button class="btn btn-sol" id="btn-solution">Solution</button>
        </div>
        <div id="hint-display" class="hidden"></div>
    </div>

    <!-- Modale Informazioni -->
    <div id="info-modal" class="modal-overlay">
        <div class="modal-box">
            <p id="info-modal-text"></p>
            <button class="btn" id="btn-close-modal" style="width: 100%;">Close</button>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
